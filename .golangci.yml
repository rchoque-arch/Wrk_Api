version: "2"

linters-settings:
  govet:
    enable:
      - shadow
  golint:
    min-confidence: 0.8
  gocyclo:
    min-complexity: 25
  dupl:
    threshold: 150
  lll:
    line-length: 200
  maligned:
    suggest-new: true
  goconst:
    min-len: 2
    min-occurrences: 2
  misspell:
    locale: US
  unused:
    check-exported: false
  unparam:
    check-exported: false
  nakedret:
    max-func-lines: 30
  prealloc:
    simple: true
    range-loops: true
    for-loops: true
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - wrapperFunc
      - hugeParam
      - rangeValCopy

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - gocyclo
    - dupl
    - goconst
    - misspell
    - lll
    - unused
    - unparam
    - nakedret
    - prealloc
    - gocritic
    - staticcheck
    - ineffassign
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - gosec
    - nolintlint
run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true

issues:
  exclude-dirs:
    - tests
  exclude-files:
    - ".*\\.pb\\.go"
    - ".*\\_test\\.go"
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - staticcheck
        - unused
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-use-default: false

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
